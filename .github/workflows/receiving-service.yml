name: Receiving Service CI

on:
  push:
    branches: [main]
    paths:
      - "services/receiving-service/**"
      - ".github/workflows/receiving-service.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/receiving-service/**"
      - ".github/workflows/receiving-service.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:password@localhost:5436/receiving_db
      PROCUREMENT_SERVICE_URL: "http://localhost:3002"
      INVENTORY_SERVICE_URL: "http://localhost:3003"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test --workspace=services/receiving-service

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: receiving_db
        ports:
          - 5436:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d receiving_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:password@localhost:5436/receiving_db
      TEST_DATABASE_URL: postgres://postgres:password@localhost:5436/receiving_db_test
      TEST_ADMIN_DATABASE_URL: postgres://postgres:password@localhost:5436/postgres
      REDIS_URL: redis://localhost:6379
      FEATURE_RECEIVING: "true"
      PROCUREMENT_SERVICE_URL: "http://localhost:3002"
      INVENTORY_SERVICE_URL: "http://localhost:3003"
      PORT: "3004"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:integration --workspace=services/receiving-service
