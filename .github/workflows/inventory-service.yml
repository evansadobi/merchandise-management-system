name: Inventory Service CI

on:
  push:
    branches: [main]
    paths:
      - "services/inventory-service/**"
      - ".github/workflows/inventory-service.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/inventory-service/**"
      - ".github/workflows/inventory-service.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:password@localhost:5434/inventory_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test --workspace=services/inventory-service

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: inventory_db
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inventory_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:password@localhost:5434/inventory_db
      REDIS_URL: redis://localhost:6379
      FEATURE_INVENTORY: "true"
      PORT: "3003"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:integration --workspace=services/inventory-service
