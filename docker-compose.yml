services:
  redis:
    image: redis:7-alpine
    container_name: mms_redis_broker
    ports:
      - "6379:6379"
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  vendor-db:
    image: postgres:15-alpine
    container_name: mms_vendor_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: vendor_db
    ports:
      - "5435:5432"
    volumes:
      - vendor_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vendor_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  procurement-db:
    image: postgres:15-alpine
    container_name: mms_procurement_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: procurement_db
    ports:
      - "5433:5432"
    volumes:
      - procurement_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d procurement_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  inventory-db:
    image: postgres:15-alpine
    container_name: mms_inventory_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: inventory_db
    ports:
      - "5434:5432"
    volumes:
      - inventory_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  receiving-db:
    image: postgres:15-alpine
    container_name: mms_receiving_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: receiving_db
    ports:
      - "5436:5432"
    volumes:
      - receiving_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d receiving_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  warehouse-db:
    image: postgres:15-alpine
    container_name: mms_warehouse_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: warehouse_db
    ports:
      - "5437:5432"
    volumes:
      - warehouse_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d warehouse_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  vendor-service:
    build: ./services/vendor-service
    container_name: mms_vendor_service
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=postgres://postgres:password@vendor-db:5432/vendor_db
      - FEATURE_VENDOR_MANAGEMENT=true
    depends_on:
      vendor-db:
        condition: service_healthy

  procurement-service:
    build: ./services/procurement-service
    container_name: mms_procurement_service
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - DATABASE_URL=postgres://postgres:password@procurement-db:5432/procurement_db
      - VENDOR_SERVICE_URL=http://vendor-service:3001
      - REDIS_URL=redis://redis:6379
      - FEATURE_PROCUREMENT=true
    depends_on:
      procurement-db:
        condition: service_healthy
      vendor-service:
        condition: service_started
      redis:
        condition: service_healthy

  inventory-service:
    build: ./services/inventory-service
    container_name: mms_inventory_service
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - DATABASE_URL=postgres://postgres:password@inventory-db:5432/inventory_db
      - REDIS_URL=redis://redis:6379
      - FEATURE_INVENTORY=true
    depends_on:
      inventory-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  receiving-service:
    build: ./services/receiving-service
    container_name: mms_receiving_service
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
      - DATABASE_URL=postgres://postgres:password@receiving-db:5432/receiving_db
      - PROCUREMENT_SERVICE_URL=http://procurement-service:3002
      - REDIS_URL=redis://redis:6379
      - FEATURE_RECEIVING=true
    depends_on:
      receiving-db:
        condition: service_healthy
      procurement-service:
        condition: service_started
      redis:
        condition: service_healthy

  warehouse-service:
    build: ./services/warehouse-service
    container_name: mms_warehouse_service
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
      - DATABASE_URL=postgres://postgres:password@warehouse-db:5432/warehouse_db
      - INVENTORY_SERVICE_URL=http://inventory-service:3003
      - REDIS_URL=redis://redis:6379
      - FEATURE_WAREHOUSE=true
    depends_on:
      warehouse-db:
        condition: service_healthy
      inventory-service:
        condition: service_started
      redis:
        condition: service_healthy

volumes:
  vendor_data:
  procurement_data:
  inventory_data:
  receiving_data:
  warehouse_data:
