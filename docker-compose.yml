services:
  redis:
    image: redis:7-alpine
    container_name: mms_redis_broker
    ports:
      - "6379:6379"
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  vendor-db:
    image: postgres:15-alpine
    container_name: mms_vendor_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: vendor_db
    ports:
      - "5435:5432"
    volumes:
      - vendor_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vendor_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  procurement-db:
    image: postgres:15-alpine
    container_name: mms_procurement_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: procurement_db
    ports:
      - "5433:5432"
    volumes:
      - procurement_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d procurement_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  inventory-db:
    image: postgres:15-alpine
    container_name: mms_inventory_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: inventory_db
    ports:
      - "5434:5432"
    volumes:
      - inventory_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  receiving-db:
    image: postgres:15-alpine
    container_name: mms_receiving_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: receiving_db
    ports:
      - "5436:5432"
    volumes:
      - receiving_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d receiving_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  warehouse-db:
    image: postgres:15-alpine
    container_name: mms_warehouse_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: warehouse_db
    ports:
      - "5437:5432"
    volumes:
      - warehouse_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d warehouse_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  retail-sales-db:
    image: postgres:15-alpine
    container_name: mms_retail_sales_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: retail_sales_db
    ports:
      - "5438:5432"
    volumes:
      - retail_sales_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d retail_sales_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  sales-audit-db:
    image: postgres:15-alpine
    container_name: mms_sales_audit_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sales_audit_db
    ports:
      - "5439:5432"
    volumes:
      - sales_audit_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sales_audit_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  financials-db:
    image: postgres:15-alpine
    container_name: mms_financials_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: financials_db
    ports:
      - "5440:5432"
    volumes:
      - financials_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d financials_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  vendor-service:
    build: ./services/vendor-service
    container_name: mms_vendor_service
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=postgres://postgres:password@vendor-db:5432/vendor_db
      - FEATURE_VENDOR_MANAGEMENT=true
    depends_on:
      vendor-db:
        condition: service_healthy

  procurement-service:
    build: ./services/procurement-service
    container_name: mms_procurement_service
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - DATABASE_URL=postgres://postgres:password@procurement-db:5432/procurement_db
      - VENDOR_SERVICE_URL=http://vendor-service:3001
      - REDIS_URL=redis://redis:6379
      - FEATURE_PROCUREMENT=true
    depends_on:
      procurement-db:
        condition: service_healthy
      vendor-service:
        condition: service_started
      redis:
        condition: service_healthy

  inventory-service:
    build: ./services/inventory-service
    container_name: mms_inventory_service
    ports:
      - "3003:3003"
      - "50051:50051"
    environment:
      - PORT=3003
      - GRPC_PORT=50051
      - DATABASE_URL=postgres://postgres:password@inventory-db:5432/inventory_db
      - REDIS_URL=redis://redis:6379
      - FEATURE_INVENTORY=true
    depends_on:
      inventory-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  receiving-service:
    build: ./services/receiving-service
    container_name: mms_receiving_service
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
      - DATABASE_URL=postgres://postgres:password@receiving-db:5432/receiving_db
      - PROCUREMENT_SERVICE_URL=http://procurement-service:3002
      - REDIS_URL=redis://redis:6379
      - FEATURE_RECEIVING=true
    depends_on:
      receiving-db:
        condition: service_healthy
      procurement-service:
        condition: service_started
      redis:
        condition: service_healthy

  warehouse-service:
    build: ./services/warehouse-service
    container_name: mms_warehouse_service
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
      - DATABASE_URL=postgres://postgres:password@warehouse-db:5432/warehouse_db
      - INVENTORY_SERVICE_URL=http://inventory-service:3003
      - REDIS_URL=redis://redis:6379
      - FEATURE_WAREHOUSE=true
    depends_on:
      warehouse-db:
        condition: service_healthy
      inventory-service:
        condition: service_started
      redis:
        condition: service_healthy

  retail-sales-service:
    build: ./services/retail-sales-service
    container_name: mms_retail_sales_service
    ports:
      - "3006:3006"
    environment:
      - PORT=3006
      - DATABASE_URL=postgres://postgres:password@retail-sales-db:5432/retail_sales_db
      - REDIS_URL=redis://redis:6379
      - FEATURE_RETAIL_SALES=true
    depends_on:
      retail-sales-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  sales-audit-service:
    build: ./services/sales-audit-service
    container_name: mms_sales_audit_service
    ports:
      - "3007:3007"
    environment:
      - PORT=3007
      - DATABASE_URL=postgres://postgres:password@sales-audit-db:5432/sales_audit_db
      - REDIS_URL=redis://redis:6379
      - FEATURE_SALES_AUDIT=true
    depends_on:
      sales-audit-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  financials-service:
    build: ./services/financials-service
    container_name: mms_financials_service
    ports:
      - "3008:3008"
    environment:
      - PORT=3008
      - DATABASE_URL=postgres://postgres:password@financials-db:5432/financials_db
      - REDIS_URL=redis://redis:6379
      - FEATURE_FINANCIALS=true
    depends_on:
      financials-db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  vendor_data:
  procurement_data:
  inventory_data:
  receiving_data:
  warehouse_data:
  retail_sales_data:
  sales_audit_data:
  financials_data:
