openapi: 3.0.3
info:
  title: Procurement Service API
  version: 1.0.0
  description: Manages purchase order intent, locks in costs and payment terms from Vendor Service, and enforces the approval workflow. Does not handle the physical arrival of goods.

components:
  schemas:
    PurchaseOrder:
      type: object
      properties:
        id:
          type: string
          format: uuid
        vendorId:
          type: string
          format: uuid
        sku:
          type: string
        quantityOrdered:
          type: integer
        quantityReceived:
          type: integer
        unitCost:
          type: string
          description: Locked in from Vendor Service at creation time — never client-supplied.
          example: "250.00"
        paymentTerms:
          type: string
        status:
          type: string
          enum: [DRAFT, APPROVED, PARTIALLY_RECEIVED, RECEIVED]
        approvedBy:
          type: string
          nullable: true
        approvedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        error:
          type: string

  parameters:
    PurchaseOrderIdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

paths:
  /api/purchase-orders:
    get:
      summary: Retrieve all purchase orders
      responses:
        "200":
          description: A list of purchase orders.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PurchaseOrder"
    post:
      summary: Create a new purchase order in DRAFT status
      description: unitCost and paymentTerms are never accepted from the client — they are fetched from Vendor Service's approved supplier list for the given SKU and locked in server-side.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vendorId, sku, quantity]
              properties:
                vendorId:
                  type: string
                  format: uuid
                sku:
                  type: string
                quantity:
                  type: integer
                  minimum: 1
      responses:
        "201":
          description: Purchase order successfully created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrder"
        "400":
          description: Missing/invalid fields, or the vendor is not an approved supplier for this SKU.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Vendor Service unreachable or returned a non-OK response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/purchase-orders/{id}:
    get:
      summary: Get a purchase order by ID
      parameters:
        - $ref: "#/components/parameters/PurchaseOrderIdParam"
      responses:
        "200":
          description: Purchase order found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrder"
        "404":
          description: Purchase order not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/purchase-orders/{id}/approve:
    patch:
      summary: Approve a purchase order from DRAFT status
      description: Requires an explicit approvedBy identifying who authorized the order. Only valid from DRAFT status. On success, publishes a PurchaseOrderApproved event to the procurement.events stream.
      parameters:
        - $ref: "#/components/parameters/PurchaseOrderIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approvedBy]
              properties:
                approvedBy:
                  type: string
      responses:
        "200":
          description: Purchase order approved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrder"
        "400":
          description: approvedBy is missing or empty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Purchase order not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Cannot approve a purchase order not in DRAFT status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/purchase-orders/{id}/receive:
    patch:
      summary: Record a partial or full receipt against an approved purchase order
      description: "NOTE: this is a Phase 1 placeholder endpoint. Once the Receiving service (Phase 2) exists, quantityReceived will be driven by consuming GoodsReceived events rather than called directly."
      parameters:
        - $ref: "#/components/parameters/PurchaseOrderIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantityReceived]
              properties:
                quantityReceived:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Receipt recorded successfully. Status becomes PARTIALLY_RECEIVED or RECEIVED depending on whether the full ordered quantity has now arrived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrder"
        "400":
          description: quantityReceived is invalid, or exceeds the remaining open balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Purchase order not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Purchase order is not in APPROVED or PARTIALLY_RECEIVED status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
