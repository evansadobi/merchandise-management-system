openapi: 3.0.3
info:
  title: Inventory Service API
  version: 1.0.0
  description: Single source of truth for stock levels, per-location tracking, and valuation. Does not decide warehouse placement and does not process sales.

components:
  schemas:
    InventoryItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        productName:
          type: string
        sku:
          type: string
        locationId:
          type: string
          example: "MAIN_WAREHOUSE"
        quantityOnHand:
          type: integer
        quantityAllocated:
          type: integer
          description: Reserved for a pending sale/order — not stored as "available"; available is computed as (quantityOnHand - quantityAllocated).
        quantityOnOrder:
          type: integer
          description: Ordered from a supplier but not yet physically received.
        unitValue:
          type: string
          example: "1.25"
        reorderLevel:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        error:
          type: string

paths:
  /api/inventory:
    get:
      summary: Retrieve all inventory items across all locations
      responses:
        "200":
          description: A list of inventory stock records.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryItem"
    post:
      summary: Create an inventory item record for a SKU at a location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productName, sku]
              properties:
                productName:
                  type: string
                sku:
                  type: string
                locationId:
                  type: string
                  description: Defaults to MAIN_WAREHOUSE if omitted.
                quantityOnHand:
                  type: integer
                  minimum: 0
                unitValue:
                  type: string
                  description: Decimal amount as a string, up to 2 decimal places.
                reorderLevel:
                  type: integer
                  minimum: 0
      responses:
        "201":
          description: Inventory item created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
        "400":
          description: Missing or invalid fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: An inventory item with this SKU already exists at this location.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/inventory/low-stock:
    get:
      summary: Retrieve items at or below their reorder threshold
      description: Backs the StockLow requirement — items where quantityOnHand <= reorderLevel.
      responses:
        "200":
          description: List of low-stock items (may be empty).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryItem"

  /api/inventory/id/{id}:
    get:
      summary: Get a single inventory item by its internal ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Inventory item found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
        "400":
          description: Invalid inventory item ID format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Inventory item not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/inventory/sku/{sku}:
    get:
      summary: Get every location row for a given SKU
      description: A product can exist at multiple locations simultaneously (e.g. main warehouse and a store backroom) — this returns all of them, not a single flattened total.
      parameters:
        - name: sku
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of location rows for this SKU.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryItem"
        "400":
          description: SKU is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No inventory record found for this SKU at any location.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/inventory/{sku}/stock:
    patch:
      summary: Adjust On Hand stock by a signed delta at a specific location
      description: "NOTE: this is a Phase 1 placeholder for manual/admin adjustments. Once the event bus is fully wired, stock changes will primarily be driven by consuming GoodsReceived/ItemSold events."
      parameters:
        - name: sku
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [delta]
              properties:
                delta:
                  type: integer
                  description: Positive to increase, negative to decrease. Cannot be zero.
                locationId:
                  type: string
                  description: Defaults to MAIN_WAREHOUSE if omitted.
      responses:
        "200":
          description: Stock adjusted successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
        "400":
          description: Delta is zero/invalid, or would reduce On Hand below zero.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Item not found at this location.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
