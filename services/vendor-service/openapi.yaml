openapi: 3.0.3
info:
  title: Vendor Service API
  version: 1.0.0
  description: Authoritative record of approved suppliers, the products they're authorized to supply, and payment terms. Does not track purchase orders or decide when to order.

components:
  schemas:
    Vendor:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        contactEmail:
          type: string
          format: email
        contactPhone:
          type: string
        paymentTerms:
          type: string
          example: "Net 30"
        leadTimeDays:
          type: integer
        status:
          type: string
          enum: [PENDING, APPROVED, SUSPENDED, ARCHIVED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    VendorProduct:
      type: object
      properties:
        id:
          type: string
          format: uuid
        vendorId:
          type: string
          format: uuid
        sku:
          type: string
        unitCost:
          type: string
          description: Decimal amount as a string to preserve precision.
          example: "250.00"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SupplierForSku:
      type: object
      description: An approved vendor authorized to supply a given SKU, with pricing and terms. This is the shape Procurement consumes when locking in a purchase order.
      properties:
        vendorId:
          type: string
          format: uuid
        vendorName:
          type: string
        paymentTerms:
          type: string
        leadTimeDays:
          type: integer
        unitCost:
          type: string
          example: "250.00"

    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 42
        totalPages:
          type: integer
          example: 3

    VendorListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Vendor"
        pagination:
          $ref: "#/components/schemas/Pagination"

    Error:
      type: object
      properties:
        error:
          type: string

  parameters:
    VendorIdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Capped at 100 regardless of requested value.

paths:
  /api/vendors:
    get:
      summary: Retrieve all vendors (paginated)
      description: Returns vendors in every status (PENDING, APPROVED, SUSPENDED, ARCHIVED) — this endpoint is unfiltered for back-office admin use. Procurement-facing lookups should use /api/vendors/sku/{sku}/suppliers instead, which filters to APPROVED only.
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: A paginated list of vendors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorListResponse"
    post:
      summary: Create a new vendor profile
      description: New vendors are created with status PENDING and must be explicitly approved via PATCH before Procurement can see them in supplier lookups.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [name, contactEmail, contactPhone, paymentTerms, leadTimeDays]
              properties:
                name:
                  type: string
                contactEmail:
                  type: string
                  format: email
                contactPhone:
                  type: string
                  example: "+254712345678"
                paymentTerms:
                  type: string
                leadTimeDays:
                  type: integer
                  minimum: 0
      responses:
        "201":
          description: Vendor created successfully with status PENDING.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
        "400":
          description: Missing or invalid fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A vendor with this email already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/vendors/{id}:
    get:
      summary: Get a vendor by ID
      parameters:
        - $ref: "#/components/parameters/VendorIdParam"
      responses:
        "200":
          description: Vendor found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
        "400":
          description: Invalid vendor ID format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Vendor not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      summary: Partially update a vendor
      description: Only fields present in the request body are validated and applied. At least one field must be provided. Used to transition a vendor's status, e.g. PENDING → APPROVED.
      parameters:
        - $ref: "#/components/parameters/VendorIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                contactEmail:
                  type: string
                  format: email
                contactPhone:
                  type: string
                paymentTerms:
                  type: string
                leadTimeDays:
                  type: integer
                  minimum: 0
                status:
                  type: string
                  enum: [PENDING, APPROVED, SUSPENDED, ARCHIVED]
      responses:
        "200":
          description: Vendor updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
        "400":
          description: Invalid vendor ID, invalid field value, or no fields provided.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Vendor not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A vendor with this email already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete a vendor
      parameters:
        - $ref: "#/components/parameters/VendorIdParam"
      responses:
        "200":
          description: Vendor deleted successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
        "400":
          description: Invalid vendor ID format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Vendor not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/vendors/sku/{sku}/suppliers:
    get:
      summary: List vendors authorized to supply a given SKU
      description: Defaults to APPROVED vendors only with a cost entry for this SKU, joined with their payment terms and lead time. This is the contract Procurement relies on to validate authorization and lock in pricing when creating a purchase order. Pass the status query parameter to filter by a different vendor status instead.
      parameters:
        - name: sku
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Filters suppliers by vendor status. Defaults to APPROVED when omitted.
          schema:
            type: string
            enum: [PENDING, APPROVED, SUSPENDED, ARCHIVED]
      responses:
        "200":
          description: List of suppliers for this SKU (may be empty).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupplierForSku"
        "400":
          description: SKU is required, or invalid status filter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/vendors/{vendorId}/products:
    get:
      summary: List all products a specific vendor is authorized to supply
      parameters:
        - name: vendorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of vendor-product cost entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VendorProduct"
        "400":
          description: Invalid vendor ID format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Vendor not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Add a product and cost to a vendor's catalog
      parameters:
        - name: vendorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sku, unitCost]
              properties:
                sku:
                  type: string
                unitCost:
                  type: string
                  description: Decimal amount as a string, up to 2 decimal places.
                  example: "250.00"
      responses:
        "201":
          description: Vendor-product entry created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorProduct"
        "400":
          description: Invalid vendor ID, missing SKU, or invalid unit cost format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Vendor not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: This vendor already has a cost entry for this SKU.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/vendors/products/{id}:
    patch:
      summary: Update a vendor-product catalog entry
      description: Update the SKU and/or unit cost of an existing vendor-product entry. At least one field must be provided.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sku:
                  type: string
                unitCost:
                  type: string
                  description: Decimal amount as a string, up to 2 decimal places.
                  example: "275.00"
      responses:
        "200":
          description: Vendor-product entry updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorProduct"
        "400":
          description: Invalid product ID, invalid field value, or no fields provided.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Vendor product not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Remove a vendor-product catalog entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Vendor product deleted successfully.
        "400":
          description: Invalid product ID format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Vendor product not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
