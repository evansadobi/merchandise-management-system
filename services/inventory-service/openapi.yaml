/api/inventory/sku/{sku}:
  get:
    summary: Get every location row for a given SKU
    description: A product can exist at multiple locations simultaneously (e.g. main warehouse and a store backroom) — this returns all of them, not a single flattened total.
    parameters:
      - $ref: "#/components/parameters/SkuParam"
    responses:
      "200":
        description: List of location rows for this SKU.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/InventoryItem"
      "400":
        description: SKU is required.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"
      "404":
        description: No inventory record found for this SKU at any location.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"

/api/inventory/transfer:
  post:
    summary: Atomically move stock between two locations
    description: >
      Decrements On Hand at the source location and increments On Hand at
      the destination in a single database transaction. Fails atomically —
      either both sides happen or neither does. Used by Warehouse
      Operations to move stock between a warehouse and a retail store
      (or between two warehouses). Does not create a new inventory item
      if the destination row doesn't exist; it upserts one, carrying
      forward the source row's product name, unit value, and reorder level.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [sku, fromLocationId, toLocationId, quantity]
            properties:
              sku:
                type: string
              fromLocationId:
                type: string
                example: "MAIN_WAREHOUSE"
              toLocationId:
                type: string
                example: "STORE_3_BACKROOM"
              quantity:
                type: integer
                minimum: 1
    responses:
      "200":
        description: Transfer completed. Returns both updated rows.
        content:
          application/json:
            schema:
              type: object
              required: [source, destination]
              properties:
                source:
                  $ref: "#/components/schemas/InventoryItem"
                destination:
                  $ref: "#/components/schemas/InventoryItem"
      "400":
        description: Invalid body, source equals destination, or insufficient On Hand at source.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"
      "404":
        description: Source location has no inventory row for this SKU.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"

/api/inventory/sku/{sku}/adjust:
  patch:
    summary: Adjust On Hand stock by a signed delta at a specific location
    description: >
      For manual/admin stock adjustments (corrections, write-offs, stock
      takes). The write is atomic at the database level — it cannot take
      On Hand below zero even under concurrent requests. Triggers a
      StockLow event if the resulting quantity is at or below the
      reorder level.
    parameters:
      - $ref: "#/components/parameters/SkuParam"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [delta]
            properties:
              delta:
                type: integer
                description: Positive to increase, negative to decrease. Cannot be zero.
              locationId:
                type: string
                description: Defaults to MAIN_WAREHOUSE if omitted.
    responses:
      "200":
        description: Stock adjusted successfully.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryItem"
      "400":
        description: Delta is zero/invalid, or would reduce On Hand below zero.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"
      "404":
        description: Item not found at this location.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"
